name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q ChromaticSketch-source.zip -d project

      - name: Repair project configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle not found")

          s = p.read_text()

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "    buildFeatures { compose true }",
                  """    compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
                  buildFeatures { compose true }""",
                  1
              )

          dependencies = [
              "implementation 'androidx.compose.runtime:runtime'",
              "implementation 'androidx.compose.ui:ui-graphics'"
          ]

          for dep in dependencies:
              if dep not in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dep,
                      1
                  )

          if "tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile)" not in s:
              s += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)

          check = p.read_text()
          assert "sourceCompatibility JavaVersion.VERSION_17" in check
          assert "jvmTarget = " + '"17"' in check
          assert "androidx.compose.runtime:runtime" in check

          print("Configuration verified:")
          print(check)
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChromaticSketch-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
