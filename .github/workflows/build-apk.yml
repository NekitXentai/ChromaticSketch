name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q ChromaticSketch-source.zip -d project

      - name: Fix project configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle not found")

          s = p.read_text()

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )

          if "dependencies {" not in s:
              s += "\ndependencies {\n}\n"

          additions = [
              "implementation 'androidx.compose.runtime:runtime'",
              "implementation 'androidx.compose.ui:ui-graphics'",
              "implementation 'androidx.compose.ui:ui-unit'"
          ]

          for dep in additions:
              if dep not in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dep,
                      1
                  )

          p.write_text(s)
          print("Project configuration updated")
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromaticSketch-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
