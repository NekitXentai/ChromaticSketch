
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip ChromaticSketch-source.zip -d project

      - name: Fix project dependencies and imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("project/app/build.gradle")
          s = gradle.read_text()

          s += """
          
          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.12.01')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.foundation:foundation'
              implementation 'androidx.compose.runtime:runtime'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.activity:activity-compose:1.10.0'
          }
          """
          gradle.write_text(s)

          files = {
              "project/app/src/main/java/com/chromaticsketch/MainActivity.kt": [
                  "import androidx.compose.ui.unit.sp"
              ],
              "project/app/src/main/java/com/chromaticsketch/SketchEngine.kt": [
                  "import androidx.compose.ui.geometry.Offset",
                  "import androidx.compose.ui.graphics.Color"
              ]
          }

          for filename, imports in files.items():
              p = Path(filename)
              s = p.read_text()
              for item in imports:
                  if item not in s:
                      pos = s.find("\n")
                      s = s[:pos+1] + item + "\n" + s[pos+1:]
              p.write_text(s)

          print("Dependencies and imports updated")
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChromaticSketch-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
